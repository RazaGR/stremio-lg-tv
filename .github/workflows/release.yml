name: Release

# Publishes a release whenever a v* tag is pushed:
#
#   git tag v1.0.3 && git push origin v1.0.3
#
# The job builds the .ipk, verifies its structure and attaches it to the
# release, along with its SHA-256 so downloads can be checked.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with appinfo.json would publish an .ipk webOS
      # refuses to install over the previous one, so fail loudly and early.
      - name: Check the tag matches appinfo.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(make -s print-version)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match appinfo.json version ${app_version}" >&2
            echo "bump \"version\" in src/appinfo.json, or retag." >&2
            exit 1
          fi
          echo "version ${app_version} matches tag ${GITHUB_REF_NAME}"

      - name: Validate sources
        run: make check

      - name: Check the connection-probe URL is still valid
        run: make check-probe

      - name: Build and verify the package
        run: make verify

      # The Homebrew Channel reads this from
      # releases/latest/download/<app-id>.manifest.json, so it must be attached
      # to every release under that exact, version-free name.
      - name: Generate the Homebrew Channel manifest
        run: make manifest

      - name: Record the checksum
        run: |
          ls -l build/*.ipk build/*.manifest.json
          sha256sum build/*.ipk | tee build/SHA256SUMS
          cat build/*.manifest.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/*.ipk
            build/*.manifest.json
            build/SHA256SUMS
